name: Website release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true

jobs:
  deploy:
    if: github.event_name != 'release' || !github.event.release.prerelease
    concurrency: website-release-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test website release logic
        run: python3 -B -m unittest discover -s website
      - name: Build website from published installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          python3 website/build.py --release "$RUNNER_TEMP/release.json" --check
      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/site.json website/index.html
          git diff --cached --quiet && exit 0
          git commit -m "website: update $TAG"
          git push
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.YINGJI_ECS_HOST }}
          DEPLOY_PORT: ${{ secrets.YINGJI_ECS_PORT }}
          DEPLOY_USER: ${{ secrets.YINGJI_ECS_USER }}
          DEPLOY_KEY: ${{ secrets.YINGJI_ECS_SSH_KEY }}
        run: |
          key=$(mktemp "$RUNNER_TEMP/yingji-deploy.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          unset DEPLOY_KEY
          sha256sum website/index.html | cut -d' ' -f1 | ssh -T -i "$key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o HostKeyAlias=yingji-website-ecs \
            -o UserKnownHostsFile=website/ecs_known_hosts "$DEPLOY_USER@$DEPLOY_HOST" deploy
